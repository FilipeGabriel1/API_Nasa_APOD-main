spring.application.name=NasaApod
server.port=8081
nasa.api.url=https://api.nasa.gov/planetary/apod
nasa.api.key=fUp11o7yoZ89ynr9AnUamsLKIPrJyoBxTLfJZmXW
nasa.images.api.url=https://images-api.nasa.gov/search

# IA generativa (OpenAI-compatible)
# Configure via .env (Windows) ou variáveis de ambiente.
ai.chat.url=${AI_CHAT_URL:}
ai.chat.apiKey=${AI_API_KEY:}
ai.chat.model=${AI_CHAT_MODEL:gpt-4o-mini}
ai.chat.includeModel=${AI_CHAT_INCLUDE_MODEL:true}
ai.chat.authHeader=${AI_CHAT_AUTH_HEADER:Authorization}
ai.chat.authScheme=${AI_CHAT_AUTH_SCHEME:Bearer}
ai.chat.timeoutSeconds=${AI_CHAT_TIMEOUT_SECONDS:30}

# Base de conhecimento para respostas específicas (opcional)
# - Coloque texto direto em AI_CHAT_KNOWLEDGE ou edite src/main/resources/ai/knowledge.txt
ai.chat.knowledge=${AI_CHAT_KNOWLEDGE:}
ai.chat.knowledgeFile=classpath:ai/knowledge.txt

# RAG (carrega múltiplos .txt em src/main/resources/ai/knowledge)
ai.chat.knowledgeDirPattern=${AI_CHAT_KNOWLEDGE_DIR_PATTERN:classpath*:ai/knowledge/*.txt}
ai.chat.knowledgeChunkMaxChars=${AI_CHAT_KNOWLEDGE_CHUNK_MAXCHARS:900}
ai.chat.knowledgeStrict=${AI_CHAT_KNOWLEDGE_STRICT:false}
ai.chat.knowledgeTopK=${AI_CHAT_KNOWLEDGE_TOPK:4}
ai.chat.knowledgeMaxChars=${AI_CHAT_KNOWLEDGE_MAXCHARS:3500}
